# uc9900 (uConsole Trackpad Keyboard) on upstream ZMK v0.3.0.
# Hardware essentials live in boards/arm/bb9900/bb9900_defconfig; this file
# holds the feature settings a user might want to change.

# Keyboard backlight (P0.09): off at power-on, Fn+Space toggles it, and it
# turns itself off after this many milliseconds without a keypress.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=40
CONFIG_ZMK_BACKLIGHT_BRT_STEP=10
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=30000

# The keyboard is USB-powered inside the uConsole: never sleep.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_EXT_POWER=y

# Trackpad: the A320 sensor is polled over I2C and fed to ZMK's pointing
# subsystem (orientation and speed are set on the listener in bb9900.dts).
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_A320_POLL_INTERVAL_MS=4

# Scrolling: hold Select (or Caps Lock, or the Fn+/ switch) and the trackpad
# scrolls. Smooth scrolling uses the HID resolution multiplier, which Linux
# turns into high-resolution wheel events.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_UC9900_SCROLL_LAYER=4
CONFIG_UC9900_CAPS_SCROLL=y
CONFIG_UC9900_SCROLL_LIGHT=y

# Trackpad light also off while the keyboard is idle (after
# CONFIG_ZMK_IDLE_TIMEOUT); a key or a touch relights it.
CONFIG_UC9900_TRACKPAD_LIGHT_IDLE_OFF=y

# Host sleep: when the host sets the Kana bit of the HID LED report (the
# uConsole-sleep service does, before suspending the USB link) or suspends
# the link, the keyboard goes dark and quiet: a layer of &none on top, no
# trackpad polling, both lights off. Cleared when the host clears the bit and
# resumes the link.
CONFIG_UC9900_HOST_SLEEP=y
CONFIG_UC9900_HOST_SLEEP_LED_BIT=4
CONFIG_UC9900_HOST_SLEEP_LAYER=6

# Both outputs: USB to the uConsole, Bluetooth to other devices
# (right Fn + Esc toggles, right Fn + 1-4 selects the profile).
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Milliseconds to wait after a setting change before writing it to flash.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=1000

CONFIG_ZMK_USB_LOGGING=n

# keyd config for the uConsole's internal ZMK keyboard.
#
# Targets ONLY the keyboard sub-device by its full ID (vendor:product:hash) so
# we don't grab the trackball on the same USB composite device.
#
# Bindings:
#   tab   — tap = Tab, hold = Super. overloadt2 commits to hold if Tab is held
#           past timeout OR another key is pressed *and released* while Tab is
#           held. Preserves Shift+Tab and fast tab-tab autocomplete.
#   front — gamepad Select on firmware built before 2026-06-26. tap = KEY_FRONT,
#           hold = KEY_F19. KEY_F19 is unmapped in essentially all userspace,
#           so apps don't react to it, but the zmk-cursor-scroll daemon listens
#           for it to enter scroll mode. Prevents Select-press from being seen
#           as a real keystroke (which terminals interpret as "exit scrollback
#           / jump to bottom"). timeout(): tap fires if released within window
#           OR another key is struck during the wait — so Select+<other key>
#           chords still work.
#   capslock — gamepad Select on newer firmware (and Fn+Tab; the host can't
#           tell them apart). tap = Caps Lock, hold = KEY_F19. That firmware
#           scrolls by itself while the host Caps Lock LED is lit; a hold never
#           reaches the host as Caps Lock, so the LED stays off and the daemon
#           does the scrolling instead.
#
# Both firmware variants report the same ID, so both Select bindings live here.
# The hold key is F19 rather than F24 because the gamepad face buttons send
# F21-F24.

[ids]
1d50:615e:93631e17

[main]
tab = overloadt2(meta, tab, 200)
front = timeout(front, 200, f19)
capslock = timeout(capslock, 200, f19)

[meta:M]
